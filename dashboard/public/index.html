<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phrase Review</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/table.css">
    <link rel="stylesheet" href="styles/chat.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="stylesheet" href="styles/tags.css">
    <link rel="stylesheet" href="styles/tabs.css">
    <style>
        .bot-prompt-proposal {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 12px 14px;
            max-width: 100%;
        }
        .proposal-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #999;
            margin-bottom: 8px;
        }
        .diff-box {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #e8e8e8;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .diff-box del {
            color: #f87171;
            background: rgba(248, 113, 113, 0.12);
            text-decoration: line-through;
        }
        .diff-box ins {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.12);
            text-decoration: none;
        }
        .diff-box .ws-diff {
            font-weight: 700;
            padding: 0 1px;
            border-radius: 3px;
        }
        .diff-box del.ws-diff { background: rgba(248, 113, 113, 0.35); }
        .diff-box ins.ws-diff { background: rgba(74, 222, 128, 0.35); }
        .proposal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }
        .proposal-actions button {
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: none;
            color: #ccc;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .proposal-actions button.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }
        .proposal-actions button:disabled { opacity: 0.6; cursor: default; }
        .approved-label { color: #4ade80; font-size: 0.85rem; }
    </style>
</head>
<body>

<header>
    <h1>Phrase Review</h1>
</header>

<main id="view-container">

    <!-- TABLE VIEW -->
    <div id="view-table" class="view active">
        <div id="table-area">
            <div id="table-section">
                <div id="table-toolbar">
                    <span>Filter:</span>
                    <button class="active" onclick="filterTable('all', this)">All</button>
                    <button onclick="filterTable('uncategorized', this)">Unapproved</button>
                    <button onclick="filterTable('approved', this)">Approved</button>
                    <button onclick="openTagFilterModal()">Tags</button>
                    <button id="sort-btn" onclick="toggleSort()">Date ↓</button>
                </div>
                <div id="active-tag-filters" class="active-filters-row" style="display:none"></div>
                <div id="table-wrapper">
                    <div id="table-body" class="phrase-cards"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- CHAT VIEW -->
    <div id="view-chat" class="view">
        <div id="chat-section">
            <div id="chat"></div>
            <div id="input-area">
                <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
                <button class="primary" id="send" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- TAGS VIEW -->
    <div id="view-tags" class="view">
        <div id="tag-sidebar">
            <div id="sidebar-header">
                <span>Tags</span>
            </div>
            <div id="tag-list"></div>
            <button onclick="showAddMainTag()">+ main tag</button>
            <div id="tag-form"></div>
        </div>
    </div>

</main>

<!-- BOTTOM TAB BAR -->
<nav id="tab-bar">
    <button class="tab-btn active" data-view="table" onclick="showView('table', this)">
        <span class="tab-icon">▤</span>
        <span>Table</span>
    </button>
    <button class="tab-btn" data-view="chat" onclick="enterChatTab(this)">
        <span class="tab-icon">💬</span>
        <span>Chat</span>
    </button>
    <button class="tab-btn" data-view="tags" onclick="showView('tags', this)">
        <span class="tab-icon">🏷</span>
        <span>Tags</span>
    </button>
</nav>


<!-- TAG FILTER MODAL -->
<div id="tag-filter-modal-overlay" style="display:none">
    <div id="tag-filter-modal" class="confirm-modal">
        <div class="modal-header">
            <span>Filter by tag</span>
            <button onclick="closeTagFilterModal()">✕</button>
        </div>
        <div id="tag-filter-groups"></div>
        <div class="modal-footer">
            <button onclick="clearTagFilter()">Clear</button>
            <button class="primary" onclick="applyTagFilter()">Apply</button>
        </div>
    </div>
</div>

<!-- TAG PICKER MODAL -->
<div id="tag-picker-modal-overlay" style="display:none">
    <div id="tag-picker-modal" class="confirm-modal">
        <div class="modal-header">
            <span>Choose a tag</span>
            <button onclick="closeTagPicker()">✕</button>
        </div>
        <div class="tag-picker-section">
            <div class="tag-picker-label">Main tag</div>
            <div id="tag-picker-main-list" class="tag-picker-chip-list"></div>
        </div>
        <div class="tag-picker-section" id="tag-picker-sub-section" style="display:none">
            <div class="tag-picker-label">Subtag</div>
            <div id="tag-picker-sub-list" class="tag-picker-chip-list"></div>
        </div>
        <div class="modal-footer">
            <button onclick="closeTagPicker()">Cancel</button>
            <button class="primary" id="tag-picker-confirm-btn" onclick="confirmTagPick()">Confirm</button>
        </div>
    </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div id="delete-modal-overlay" style="display:none">
    <div id="delete-modal" class="confirm-modal">
        <div id="delete-modal-text"></div>
        <div class="modal-footer">
            <button onclick="closeDeleteModal()">Cancel</button>
            <button class="primary danger" onclick="confirmDeletePhrase()">Delete</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="tagsState.js"></script>
<script src="tagsSidebar.js"></script>
<script src="tagsMerge.js"></script>
<script src="app.js"></script>

</body>
</html>
