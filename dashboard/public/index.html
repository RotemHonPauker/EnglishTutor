<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraza</title>

    <!-- PWA: makes the app installable and gives it an icon/name on the home screen -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- iOS-specific tags (Android reads everything it needs from manifest.json) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Fraza">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/table.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="stylesheet" href="styles/tags.css">
    <link rel="stylesheet" href="styles/analytics.css">
    <link rel="stylesheet" href="styles/tabs.css">
    <link rel="stylesheet" href="styles/capture.css">
    <link rel="stylesheet" href="styles/transcripts.css">
</head>
<body>

<!-- APP LOADING OVERLAY: shown until initial data (tags + phrases) has
     loaded, then faded out — covers the whole app regardless of which tab
     is active, since the same brief load happens once at startup. -->
<div id="app-loading-overlay">
    <img src="icons/loading.svg" class="loading-logo" alt="Loading">
</div>

<!-- SPACE HEADER: shown above every tab, always. Tapping it opens the
     space picker/create modal. -->
<header id="space-header" onclick="openSpacePicker()">
    <span id="space-health-dot" class="space-health-dot"></span>
    <span id="space-header-name">Select a space</span>
    <span class="space-header-chevron">▾</span>
</header>

<main id="view-container">

    <!-- PRACTICE VIEW -->
    <div id="view-practice" class="view active">
        <div id="table-area">
            <div id="date-scroll-bar">
                <div class="mode-toggle" id="date-granularity-toggle">
                    <button class="mode-toggle-btn active" data-granularity="day" onclick="setDateGranularity('day', this)">Daily</button>
                    <button class="mode-toggle-btn" data-granularity="week" onclick="setDateGranularity('week', this)">Weekly</button>
                    <button class="mode-toggle-btn" data-granularity="month" onclick="setDateGranularity('month', this)">Monthly</button>
                </div>
                <div id="date-scroll-track"></div>
            </div>
            <div id="table-section">
                <div id="table-toolbar">
                    <span id="phrase-count"></span>
                    <button onclick="openTagFilterModal()">Tags</button>
                    <button id="learned-filter-btn" onclick="toggleLearnedFilter()">All</button>
                </div>
                <div id="active-tag-filters" class="active-filters-row" style="display:none"></div>
                <div id="table-wrapper">
                    <div id="table-body" class="phrase-cards"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- TAGS VIEW -->
    <div id="view-tags" class="view">
        <div id="tag-sidebar">
            <div id="sidebar-header">
                <span>Tags</span>
                <button onclick="openAddTagModal()">+ tag</button>
            </div>
            <div id="tag-list"></div>
        </div>
    </div>

    <!-- ANALYTICS VIEW -->
    <div id="view-analytics" class="view">
        <div id="analytics-section">
            <div class="mode-toggle" id="analytics-granularity-toggle">
                <button class="mode-toggle-btn active" data-granularity="day" onclick="setAnalyticsGranularity('day', this)">Daily</button>
                <button class="mode-toggle-btn" data-granularity="week" onclick="setAnalyticsGranularity('week', this)">Weekly</button>
                <button class="mode-toggle-btn" data-granularity="month" onclick="setAnalyticsGranularity('month', this)">Monthly</button>
            </div>
            <div class="mode-toggle" id="analytics-mode-toggle">
                <button class="mode-toggle-btn active" data-mode="tag" onclick="setAnalyticsMode('tag', this)">By tag</button>
                <button class="mode-toggle-btn" data-mode="learned" onclick="setAnalyticsMode('learned', this)">Learned</button>
            </div>
            <div id="analytics-chart-bars"></div>
            <div id="analytics-chart-legend"></div>
        </div>
    </div>

    <!-- ADD VIEW -->
    <div id="view-add" class="view">
        <div id="capture-section">
            <div id="capture-header-row">
                <div class="mode-toggle" id="capture-mode-toggle">
                    <button class="mode-toggle-btn active" data-mode="capture" onclick="setCaptureMode('capture', this)">Hebrew phrase</button>
                    <button class="mode-toggle-btn" data-mode="check" onclick="setCaptureMode('check', this)">Check my English</button>
                </div>
                <button id="capture-history-btn" onclick="toggleCaptureView()" title="Recording logs">📄</button>
            </div>
            <div id="capture-log"></div>
            <div id="capture-input-area">
                <div id="capture-text-row">
                    <textarea id="capture-text-input" rows="1" placeholder="Type a Hebrew phrase..."></textarea>
                    <button class="primary" id="capture-send-btn" onclick="submitTypedPhrase()">Send</button>
                </div>
                <div id="capture-record-row">
                    <input type="file" id="recording-file-input" accept="audio/*,video/mp4,.mp4,.m4a,.aac,.wav,.mp3,.ogg" style="display:none" onchange="handleRecordingFileSelected(this)">
                    <button id="recording-upload-btn" onclick="document.getElementById('recording-file-input').click()">🎙️ Choose recording</button>
                </div>
                <div id="recording-limit-note">Recordings are limited to about 30 minutes.</div>
            </div>
        </div>
    </div>

</main>

<!-- BOTTOM TAB BAR -->
<nav id="tab-bar">
    <button class="tab-btn" data-view="add" onclick="enterCaptureTab(this)">
        <span class="tab-icon">➕</span>
        <span>Add</span>
    </button>
    <button class="tab-btn active" data-view="practice" onclick="showView('practice', this)">
        <span class="tab-icon">📋</span>
        <span>Practice</span>
    </button>
    <button class="tab-btn" data-view="tags" onclick="showView('tags', this)">
        <span class="tab-icon">#️⃣</span>
        <span>Tags</span>
    </button>
    <button class="tab-btn" data-view="analytics" onclick="showView('analytics', this)">
        <span class="tab-icon">📊</span>
        <span>Analytics</span>
    </button>
</nav>


<!-- TAG FILTER MODAL -->
<div id="tag-filter-modal-overlay" style="display:none">
    <div id="tag-filter-modal" class="confirm-modal">
        <div class="modal-header">
            <span>Filter by tag</span>
            <button onclick="closeTagFilterModal()">✕</button>
        </div>
        <div id="tag-filter-groups"></div>
        <div class="modal-footer">
            <button onclick="clearTagFilter()">Clear</button>
            <button class="primary" onclick="applyTagFilter()">Apply</button>
        </div>
    </div>
</div>

<!-- TAG PICKER MODAL -->
<div id="tag-picker-modal-overlay" style="display:none">
    <div id="tag-picker-modal" class="confirm-modal">
        <div class="modal-header">
            <span>Choose a tag</span>
            <button onclick="closeTagPicker()">✕</button>
        </div>
        <div class="tag-picker-section">
            <div id="tag-picker-list" class="tag-picker-chip-list"></div>
        </div>
        <div class="modal-footer">
            <button onclick="closeTagPicker()">Cancel</button>
            <button class="primary" id="tag-picker-confirm-btn" onclick="confirmTagPick()">Confirm</button>
        </div>
    </div>
</div>

<!-- TAG EDIT MODAL (delete / edit, and add-tag) -->
<div id="tag-edit-modal-overlay" style="display:none">
    <div id="tag-edit-modal" class="confirm-modal">
        <div class="modal-header">
            <span id="tag-edit-modal-title">Tag</span>
            <button onclick="closeTagEditModal()">✕</button>
        </div>
        <div id="tag-edit-modal-body"></div>
        <div id="tag-edit-modal-footer" class="modal-footer"></div>
    </div>
</div>

<!-- SPACE PICKER MODAL -->
<div id="space-picker-modal-overlay" style="display:none">
    <div id="space-picker-modal" class="confirm-modal">
        <div class="modal-header">
            <span>Spaces</span>
            <button onclick="closeSpacePicker()">✕</button>
        </div>
        <div id="space-picker-list"></div>
        <div id="space-picker-new-form"></div>
        <div class="modal-footer">
            <button onclick="closeSpacePicker()">Cancel</button>
            <button class="primary" onclick="showNewSpaceForm()">+ New space</button>
        </div>
    </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div id="delete-modal-overlay" style="display:none">
    <div id="delete-modal" class="confirm-modal">
        <div id="delete-modal-text"></div>
        <div class="modal-footer">
            <button onclick="closeDeleteModal()">Cancel</button>
            <button class="primary danger" onclick="confirmDeletePhrase()">Delete</button>
        </div>
    </div>
</div>

<script src="loadingOverlay.js"></script>
<script src="spacesState.js"></script>
<script src="tagsState.js"></script>
<script src="tagsSidebar.js"></script>
<script src="tagsMerge.js"></script>
<script src="colorUtils.js"></script>
<script src="phrasesTable.js"></script>
<script src="practiceDateScroll.js"></script>
<script src="analyticsChart.js"></script>
<script src="phraseTagPicker.js"></script>
<script src="phraseTagFilter.js"></script>
<script src="captureTab.js"></script>
<script src="transcriptsTab.js"></script>
<script src="app.js"></script>

</body>
</html>
